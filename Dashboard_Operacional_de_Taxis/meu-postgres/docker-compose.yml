version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meu_postgres_container
    environment:
      POSTGRES_USER: jacksonls
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: jacksondb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
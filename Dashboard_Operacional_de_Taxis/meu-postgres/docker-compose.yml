version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meu_postgres_container
    environment:
      POSTGRES_USER: "usuário"
      POSTGRES_PASSWORD: "senha"
      POSTGRES_DB: "database"
    ports:
      - "porta"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
